components:
  schemas:
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    Association:
      type: object
      description: Base for read serializers. Read-only by convention.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        registered:
          type: string
          format: date
        address:
          type: string
          maxLength: 255
        number_of_associated:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        picture:
          type: string
          format: uri
        district:
          allOf:
          - $ref: '#/components/schemas/District'
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,6})?$
          nullable: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/AssociationImage'
          readOnly: true
      required:
      - address
      - district
      - id
      - images
      - name
      - number_of_associated
      - picture
      - registered
    AssociationImage:
      type: object
      description: Base for read serializers. Read-only by convention.
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
      required:
      - id
      - image
    AssociationWrite:
      type: object
      description: |-
        Base for write serializers. Handles translation field expansion
        and default-language validation automatically.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        registered:
          type: string
          format: date
        address:
          type: string
          maxLength: 255
        number_of_associated:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        picture:
          type: string
          format: uri
        district:
          type: integer
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,6})?$
          nullable: true
        name_pt:
          type: string
          nullable: true
        name_fr:
          type: string
          nullable: true
        name_en:
          type: string
          nullable: true
        address_pt:
          type: string
          nullable: true
        address_fr:
          type: string
          nullable: true
        address_en:
          type: string
          nullable: true
      required:
      - address
